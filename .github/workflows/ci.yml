name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # job-level permissions replace the workflow's; private repos need this to check out
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            infra: # Terraform code only — docs like infra/README.md don't trigger plan/apply
              - 'infra/envs/**'
              - 'infra/modules/**'

  app-checks:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo needs main's history to compute affected packages

      - uses: ./.github/actions/setup

      - name: Formatting
        run: pnpm format:check

      - name: Lint, typecheck, test, build (affected packages only)
        run: pnpm turbo run lint typecheck test build --filter="...[origin/main]"

  terraform-plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # post the plan as a PR comment
    concurrency:
      group: terraform-prod # never run alongside a deploy apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
      HAS_TF_TOKEN: ${{ secrets.TF_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..

      # Until the Phase 0 secrets exist, validate offline and skip the plan (not a failure).
      - name: Secrets not set yet — offline validate only
        if: env.HAS_TF_TOKEN != 'true'
        run: |
          echo "::notice::TF_API_TOKEN is not set (PLAN.md Phase 0) — skipping terraform plan."
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: terraform init
        if: env.HAS_TF_TOKEN == 'true'
        run: terraform init -input=false

      - name: terraform validate
        if: env.HAS_TF_TOKEN == 'true'
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        if: env.HAS_TF_TOKEN == 'true'
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m | tee plan.txt

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/envs/prod/plan.txt';
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output.';
            const max = 60000;
            if (plan.length > max) plan = '…(truncated)…\n' + plan.slice(-max);
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}
            ### Terraform plan (prod) — \`${process.env.PLAN_OUTCOME}\`
            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>

            Merging this PR to \`main\` will **apply** this plan.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
