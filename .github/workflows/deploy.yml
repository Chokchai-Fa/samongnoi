name: Deploy

on:
  push:
    branches: [main] # merged PRs land here too
  workflow_dispatch: # manual re-deploy of everything

# One deploy at a time; never cancel a run mid-apply.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            infra:
              - 'infra/**'

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

  # One Worker serves both the SPA (Workers Static Assets from apps/web/dist) and the API
  # (/api/*), so web and api always ship together in a single deploy.
  app:
    needs: [changes, infra]
    # Run when app code or infra changed, and infra either succeeded or was skipped.
    if: >-
      always() &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.infra == 'true') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Exports DATABASE_URL, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, ...
      # (masked) from Terraform state — the single source of truth for generated secrets.
      - uses: ./.github/actions/terraform-outputs
        with:
          tf-api-token: ${{ secrets.TF_API_TOKEN }}

      # web must build first: apps/api/wrangler.toml serves ../web/dist as static assets.
      - name: Build web + api
        run: pnpm turbo run build --filter=web... --filter=api...

      # Migrations run BEFORE the new code ships, so they must be backward-compatible
      # with the currently deployed Worker (expand first, contract in a later deploy).
      - name: Run database migrations
        run: pnpm --filter api db:migrate

      # `secrets:` lists env var NAMES; wrangler uploads their values as encrypted Worker
      # secrets (`wrangler secret bulk`) before deploying. Generated secrets come from the
      # terraform-outputs step; hand-made third-party keys come from GitHub secrets via `env:`.
      - name: Deploy Worker (API + static assets)
        uses: cloudflare/wrangler-action@v3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy
          secrets: |
            DATABASE_URL
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
            GEMINI_API_KEY
