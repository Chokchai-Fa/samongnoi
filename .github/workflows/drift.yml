name: Terraform drift check

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC
  workflow_dispatch:

concurrency:
  group: terraform-prod
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false # keep real exit codes for -detailed-exitcode

      - name: terraform init
        run: terraform init -input=false

      # Exit code 0 = no changes, 1 = error, 2 = drift detected.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode > plan.txt 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Open issue on drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          title="Terraform drift detected in prod"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Drift issue already open; skipping."
            exit 0
          fi
          {
            echo "Scheduled \`terraform plan\` found differences between \`infra/\` and the live resources."
            echo "Someone may have changed a resource in a provider dashboard. Reconcile in code, or re-apply."
            echo
            echo '```hcl'
            tail -c 60000 plan.txt
            echo '```'
          } > body.md
          gh issue create --title "$title" --body-file body.md
