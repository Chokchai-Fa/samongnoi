# The single Worker: Hono API on /api/* + the SPA (apps/web/dist) via Workers Static Assets.
# Non-secret config only — this file is committed. Secrets are uploaded by CI (see CLAUDE.md).
name = "app"                                # → https://app.samongnoi.workers.dev
main = "src/index.ts"
compatibility_date = "2026-10-01"           # bump deliberately, never automatically
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
APP_ENV = "production"
APP_URL = "https://app.samongnoi.workers.dev"

[assets]                                    # Workers Static Assets: the SPA
directory = "../web/dist"                   # build apps/web first (turbo does this)
not_found_handling = "single-page-application"  # unknown paths → index.html (client routing)
run_worker_first = ["/api/*"]               # only API paths invoke the Worker; assets are free

[ai]
binding = "AI"                             # Workers AI fallback summarizer → c.env.AI (no Terraform)

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "samongnoi-jobs"                    # must match the Terraform queue name

[[queues.consumers]]
queue = "samongnoi-jobs"
max_batch_size = 10
max_retries = 3

[[durable_objects.bindings]]
name = "THREAD_ROOM"
class_name = "ThreadRoom"            # one room per thread: sockets, presence, serial answers

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThreadRoom"]  # Free plan: SQLite-backed Durable Objects only
